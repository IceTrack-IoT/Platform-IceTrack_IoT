# Test profile: keeps the Spring context self-contained, with no external service.
# Activated by @ActiveProfiles("test") on the context tests.

# In-memory H2 database, in PostgreSQL compatibility mode, instead of the PostgreSQL server
# configured in application.properties.
spring.datasource.url=jdbc:h2:mem:icetrack;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database=h2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Secrets required at startup. Test-only values: never use them outside the test suite.
authorization.jwt.secret=oU+N0HNumYVn4f+878qKtjFFqCIX0dStnR5DjgocsA0hR6BdcVXnRERQPxav3nHfKGO5qqR1MPxllxARM3gv0w==
assets.address-validation.secret=Wh0CgDuEoMuTGMmOZd7xQi3oQyQEvILy85Gc109cqps=

# Local adapters instead of Google Cloud Storage and Firebase, which need credentials.
reporting.storage.provider=local
notifications.push.provider=none

# Keeps the scheduler-driven background jobs from slowing the context tests down.
monitoring.maintenance-window.expiry-sweep-delay-ms=3600000
outbox.dispatcher.fixed-delay-ms=3600000
