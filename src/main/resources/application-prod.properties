# Production profile (SPRING_PROFILES_ACTIVE=prod).
#
# Overrides application.properties for a deployed instance; the local counterpart is
# application-dev.properties, which application.properties selects when no profile is active.
# Every value here stays overridable from the environment, so the same image serves the Docker
# Compose stack and a PaaS deployment such as Railway.

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
# SQL logging is a development aid: it writes and formats every statement the request threads
# issue, which costs CPU and disk for no operational benefit once the instance is deployed.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ---------------------------------------------------------------------------
# Reverse proxy
# ---------------------------------------------------------------------------
# The instance sits behind the platform's proxy (Railway, nginx, a load balancer), so the
# X-Forwarded-* headers are what carry the real client address. Trusting them is what makes the
# sign-in throttling count the caller instead of the proxy, and what builds correct absolute
# links.
server.forward-headers-strategy=framework

# ---------------------------------------------------------------------------
# Report files and push notifications
# ---------------------------------------------------------------------------
# Safe defaults for a deployment that has no Google credentials: reports go to the local disk and
# pushes are only logged, so the context starts with nothing mounted. Switch them to the cloud
# adapters once the service-account files are available:
#   REPORTING_STORAGE_PROVIDER=gcs, PUSH_PROVIDER=fcm
reporting.storage.provider=${REPORTING_STORAGE_PROVIDER:local}
notifications.push.provider=${PUSH_PROVIDER:none}

# Where the local adapter writes its report files. A container filesystem is usually ephemeral:
# mount a volume here so generated reports survive a redeploy.
reporting.storage.local.directory=${REPORTING_STORAGE_LOCAL_DIRECTORY:${java.io.tmpdir}/icetrack-reports}

# ---------------------------------------------------------------------------
# Thread and connection pools
# ---------------------------------------------------------------------------
# Smaller than the development defaults, which are sized for 500 reading batches per minute: a
# single small instance does not need 200 request threads or 10 database connections held open.
# Raise them from the environment when the fleet of gateways grows.
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:50}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
# An idle pool keeps one database connection, not five: every PostgreSQL connection costs memory
# on the database service too. The pool grows on demand up to the maximum.
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

# ---------------------------------------------------------------------------
# Background polling and network cost
# ---------------------------------------------------------------------------
# The outbox dispatcher polls the database on a fixed delay; 5 seconds instead of 2 cuts those
# queries by more than half and still delivers integration events promptly.
outbox.dispatcher.fixed-delay-ms=${OUTBOX_DISPATCH_DELAY_MS:5000}

# JSON responses are compressed, which lowers the outbound traffic a PaaS bills for. Event streams
# (text/event-stream) are not in the compressed types, so telemetry streams stay unbuffered.
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,text/plain,text/html,text/css,application/javascript

# Lets in-flight requests finish when the platform replaces the instance on a redeploy.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
