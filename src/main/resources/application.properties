# Shared configuration for every profile.
#
#   dev  - local execution. It is the default (see spring.profiles.active below) and its overrides
#          live in application-dev.properties.
#   prod - a deployed instance, see application-prod.properties.
#   test - the context tests, see src/test/resources/application-test.properties.
#
# Only settings that hold in every environment belong here. Anything that depends on the machine is
# either read from the environment or overridden by the profile file. Secrets have no default:
# startup fails when one is missing.

# ---------------------------------------------------------------------------
# Profile selection
# ---------------------------------------------------------------------------
# Running the jar or the IDE without arguments starts the dev profile, so a local machine needs no
# extra flags. It is a default, never an activation: a deployment that sets
# SPRING_PROFILES_ACTIVE=prod, a command line or @ActiveProfiles("test") always wins over it.
spring.profiles.default=dev

# ---------------------------------------------------------------------------
# DataSource
# ---------------------------------------------------------------------------
# JDBC : SGDB :// HOST : PORT / DB
spring.datasource.url:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/icetrack}
spring.datasource.username: ${SPRING_DATASOURCE_USERNAME:postgres}
# No default: the database password must come from the environment
spring.datasource.password: ${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name: org.postgresql.Driver

# ---------------------------------------------------------------------------
# Spring Data JPA
# ---------------------------------------------------------------------------
spring.jpa.database: postgresql
spring.jpa.hibernate.ddl-auto: update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=pe.edu.upc.ice.track.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Jackson JSON Configuration
# Standardizes every REST resource field to snake_case (e.g. full_name, postal_code, id_token)
spring.jackson.property-naming-strategy=SNAKE_CASE

server.port: ${PORT:8080}

# Elements take their values from maven pom.xml build-related information
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# i18n message bundles
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Application identity (consumed by the OpenAPI descriptor)
spring.application.name=IceTrack Platform API

# ---------------------------------------------------------------------------
# Authentication
# ---------------------------------------------------------------------------
# Internal bearer token (domain JWT) issued by the platform after a successful authentication.
# Base64-encoded HS512 key of at least 64 decoded bytes. Generate it with
# `openssl rand -base64 64 | tr -d '\n'`: without stripping the line break only the first of the
# two output lines lands in .env and the key is too short. There is no default: startup fails when
# JWT_SECRET is missing, blank, not Base64 or too short.
authorization.jwt.secret=${JWT_SECRET:}
# Short-lived: access tokens are validated statelessly and cannot be revoked before they expire
authorization.jwt.expiration.minutes=${JWT_EXPIRATION_MINUTES:30}

# Opaque, single-use refresh tokens (persisted as SHA-256 digests, rotated on every refresh)
authorization.refresh-token.expiration.days=${REFRESH_TOKEN_EXPIRATION_DAYS:7}
# A rotated token presented again within this window is a concurrent refresh (e.g. two browser
# tabs): 401 REFRESH_TOKEN_RECENTLY_ROTATED, recoverable by a single retry with the latest token.
# Later on it is a replay: 401 REFRESH_TOKEN_REPLAY_DETECTED and every session is revoked.
# 0 disables the window.
authorization.refresh-token.reuse-grace-period.seconds=${REFRESH_TOKEN_REUSE_GRACE_SECONDS:20}
# Daily purge of expired refresh tokens (Spring cron: second minute hour day month weekday)
authorization.refresh-token.purge.cron=${REFRESH_TOKEN_PURGE_CRON:0 0 3 * * *}

# Google OIDC token exchange.
# The frontend performs the Google login and posts the resulting id_token; the backend
# validates it against Google's JWKS with Spring Security's NimbusJwtDecoder.
authorization.google.client-id=${GOOGLE_CLIENT_ID:google-client-id}
authorization.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
authorization.google.issuers=https://accounts.google.com,accounts.google.com
authorization.google.require-verified-email=true

# Throttling of the endpoints that verify a credential (sign-in/local, google/verify, google/link).
# A client address or an account collecting this many 401 answers within one window is answered
# 429 TOO_MANY_REQUESTS, with a Retry-After header, until the window ends. Counters are kept in
# memory, per instance. Behind a reverse proxy, set server.forward-headers-strategy so the client
# address is not the proxy's (the prod profile already does).
authorization.sign-in.rate-limit.max-failures=${SIGN_IN_RATE_LIMIT_MAX_FAILURES:5}
authorization.sign-in.rate-limit.window-minutes=${SIGN_IN_RATE_LIMIT_WINDOW_MINUTES:5}

# ---------------------------------------------------------------------------
# Edge grants and maintenance windows
# ---------------------------------------------------------------------------
# Edge grants: short-lived tokens (it_grt_...) issued to the technician when a service request is
# accepted, letting the mobile app operate the on-site gateway. Revoked on reassignment,
# cancellation and completion; regenerable by the technician.
service-request.edge-grant.ttl-hours=${EDGE_GRANT_TTL_HOURS:24}

# Maintenance windows reported by the edge gateways. Gateways close expired windows themselves; a
# window still open this many minutes after its expiration is closed by the platform as EXPIRED, so
# its unit leaves MAINTENANCE when its gateway went silent. The sweep runs every
# expiry-sweep-delay-ms milliseconds.
monitoring.maintenance-window.expiry-grace-minutes=${MAINTENANCE_WINDOW_EXPIRY_GRACE_MINUTES:30}
monitoring.maintenance-window.expiry-sweep-delay-ms=${MAINTENANCE_WINDOW_EXPIRY_SWEEP_MS:60000}

# Offline detection. Every fixed-delay-ms milliseconds (one 60-second synchronization window) a connected
# unit whose latest batch arrived longer ago than its offline window is marked offline and gets a
# DEVICE_OFFLINE alert. With several instances only one runs each round: it takes a lease in the
# scheduled_task_locks table for lock-lease-ms milliseconds, which must stay shorter than the interval.
monitoring.offline-detection.enabled=${OFFLINE_DETECTION_ENABLED:true}
monitoring.offline-detection.fixed-delay-ms=${OFFLINE_DETECTION_DELAY_MS:60000}
monitoring.offline-detection.initial-delay-ms=${OFFLINE_DETECTION_INITIAL_DELAY_MS:60000}
monitoring.offline-detection.lock-lease-ms=${OFFLINE_DETECTION_LOCK_LEASE_MS:50000}

# Transactional outbox. Integration events are stored with the change they announce and delivered
# by a dispatcher every fixed-delay-ms milliseconds, at least once. An event that failed
# max-attempts deliveries stays in outbox_events, unpublished, and is no longer tried.
outbox.dispatcher.fixed-delay-ms=${OUTBOX_DISPATCH_DELAY_MS:2000}
outbox.dispatcher.max-attempts=${OUTBOX_MAX_ATTEMPTS:10}

# ---------------------------------------------------------------------------
# Google Maps
# ---------------------------------------------------------------------------
# Addresses are verified synchronously by POST /api/v1/assets/sites/validate-address, with a bounded
# timeout. With the placeholder key every verification is refused by Google and answered 503.
google.maps.api-key=${GOOGLE_MAPS_API_KEY:YOUR_MAPS_DEMO_KEY}
google.maps.geocoding-url=https://maps.googleapis.com/maps/api/geocode/json

# Address validation tokens (15 minutes). Signed with their own HMAC key, never the user JWT key.
# Base64, at least 32 decoded bytes (openssl rand -base64 32). There is no default: startup fails
# when ADDRESS_VALIDATION_SECRET is missing, not Base64 or too short.
assets.address-validation.secret=${ADDRESS_VALIDATION_SECRET:}

# ---------------------------------------------------------------------------
# Thread and connection pools
# ---------------------------------------------------------------------------
# Keeps Spring Boot's own applicationTaskExecutor as the default @Async executor, even though the
# reporting and monitoring contexts declare dedicated reportTaskExecutor and streamTaskExecutor beans.
spring.task.execution.mode=force

# Thread and connection pools, sized for 500 reading batches per minute with a p95 ingestion
# latency of at most 500 ms. Ingestion runs on the request threads and holds a database connection
# for a few milliseconds; everything slow runs on its own pool:
#   - applicationTaskExecutor (default @Async): push notifications and maintenance window notices.
#     Bounded, so a provider outage cannot grow the queue without limit; a submission refused by a
#     full queue fails in its caller.
#   - reportTaskExecutor (reporting): report generation, 1 to 2 threads.
#   - streamTaskExecutor (monitoring): writes to the telemetry streams (see below).
# Open telemetry streams hold a connection of the server but no request thread: they are parked by
# the servlet container's asynchronous support until an event is written.
spring.task.execution.thread-name-prefix=app-task-
spring.task.execution.pool.core-size=${APP_TASK_POOL_CORE_SIZE:8}
spring.task.execution.pool.max-size=${APP_TASK_POOL_MAX_SIZE:16}
spring.task.execution.pool.queue-capacity=${APP_TASK_POOL_QUEUE_CAPACITY:5000}
# Three scheduler threads, so a slow outbox run or offline detection round never delays the stream
# heartbeat past a proxy's idle timeout.
spring.task.scheduling.pool.size=3
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:8192}
# Fails fast when every connection is busy, instead of keeping a request waiting for 30 seconds.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:5000}

# ---------------------------------------------------------------------------
# Real-time telemetry stream
# ---------------------------------------------------------------------------
# Real-time telemetry stream (Server-Sent Events).
# An owner exchanges its JWT for a single-use ticket valid for 60 seconds
# (POST /api/v1/telemetry/stream-ticket), then opens GET /api/v1/telemetry/stream?ticket=..., which
# stays open for 30 minutes. Tickets and streams live in this instance's memory: with several
# replicas, use sticky sessions and fan events out between instances.
# Unredeemed tickets one owner may hold, and tickets the instance keeps in total; beyond them a new
# ticket is answered 429.
monitoring.telemetry-stream.max-pending-tickets-per-owner=${TELEMETRY_STREAM_MAX_PENDING_TICKETS_PER_OWNER:10}
monitoring.telemetry-stream.max-pending-tickets=${TELEMETRY_STREAM_MAX_PENDING_TICKETS:10000}
monitoring.telemetry-stream.ticket-purge-delay-ms=60000
# Streams one owner may keep open (browser tabs); opening one more closes the oldest.
monitoring.telemetry-stream.max-streams-per-owner=${TELEMETRY_STREAM_MAX_PER_OWNER:10}
# Interval of the heartbeat comment that keeps proxies from closing idle streams.
monitoring.telemetry-stream.heartbeat-ms=${TELEMETRY_STREAM_HEARTBEAT_MS:25000}
# Pool writing to the streams; a write to a stalled client blocks its thread, hence more than one or
# two. Threads beyond the core size are only added once the queue is full; when it is full and every
# thread is busy, the oldest pending update is dropped.
monitoring.telemetry-stream.executor.core-size=4
monitoring.telemetry-stream.executor.max-size=8
monitoring.telemetry-stream.executor.queue-capacity=1000

# ---------------------------------------------------------------------------
# Reporting storage
# ---------------------------------------------------------------------------
# Which adapter stores the report files is chosen by the profile (local disk in dev, configurable
# in prod); these are the settings the gcs adapter reads when it is the one selected. Report files
# are private; downloads use signed URLs valid for 15 minutes.
reporting.storage.gcs.bucket=icetrack-reports
reporting.storage.gcs.project-id=project-c12ca6a0-6804-403c-8c5
reporting.storage.gcs.credentials-path=${GCS_CREDENTIALS_PATH:/icetrack-sa.json}
# Content of the key (not a path) for platforms without file mounts; takes precedence over the path
reporting.storage.gcs.credentials-json=${GCS_CREDENTIALS_JSON:}

# ---------------------------------------------------------------------------
# Push notifications
# ---------------------------------------------------------------------------
# Which gateway delivers the pushes is chosen by the profile (logged only in dev, configurable in
# prod); these are the settings the fcm adapter reads when it is the one selected.
notifications.push.fcm.project-id=${FCM_PROJECT_ID:}
notifications.push.fcm.credentials-path=${FCM_CREDENTIALS_PATH:/icetrack-fcm-sa.json}
# Content of the key (not a path) for platforms without file mounts; takes precedence over the path
notifications.push.fcm.credentials-json=${FCM_CREDENTIALS_JSON:}
