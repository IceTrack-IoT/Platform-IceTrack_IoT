# Local execution (SPRING_PROFILES_ACTIVE=dev, the profile application.properties activates by
# default when nothing else is said).
#
# Everything else comes from application.properties: this file only turns on what helps while
# developing and points the integrations at their local adapters, so a machine without Google
# credentials can start the application and use every endpoint.

# ---------------------------------------------------------------------------
# SQL logging
# ---------------------------------------------------------------------------
# Echoes every statement Hibernate issues, formatted and annotated with the entity query it came
# from, which is what makes a slow endpoint or a wrong join visible while developing. The prod
# profile keeps the same code with the logging off: do not expect this in a deployment.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ---------------------------------------------------------------------------
# Local adapters
# ---------------------------------------------------------------------------
# Report files are written to the local disk instead of a bucket, and pushes are only logged
# instead of being sent through Firebase, so neither needs a service-account file. The gcs and fcm
# settings of application.properties stay unused until a profile selects them.
reporting.storage.provider=local
notifications.push.provider=none
reporting.storage.local.directory=${REPORTING_STORAGE_LOCAL_DIRECTORY:${java.io.tmpdir}/icetrack-reports}
