# Default (English) message bundle.
#
# Resolved through spring.messages.basename=messages by:
#   - shared.interfaces.rest.transform.ErrorResponseAssembler (error.<error-code>.message keys,
#     where {0} is the error detail and {1} the entity name)
#   - shared.interfaces.rest.GlobalExceptionHandler (validation.* and error.unexpected.context keys)
#   - Bean Validation constraint messages declared as {key} on the REST resources

# Bean Validation constraints
validation.not-blank=must not be blank
validation.not-null=must not be null
validation.size.max=must not exceed {max} characters
validation.certification-number=must be 3 to 50 letters, digits, '-', '.' or '/', starting with a letter or digit
validation.email=must be a well-formed email address
validation.positive=must be greater than zero

# GlobalExceptionHandler
validation.field.prefix=Field
validation.request.failed=Request validation failed
validation.request.argument=request-argument
validation.request.parameter.enum=Parameter ''{0}'' must be one of {1}
validation.request.parameter.invalid=Parameter ''{0}'' has an invalid value
validation.request.body.unreadable=The request body is malformed or holds a value outside the accepted set
error.unexpected.context=global-exception-handler

# Generic error codes
error.validation-error.message={0}
error.business-rule-violation.message={0}
error.unexpected-error.message=An unexpected error occurred: {0}
error.generic.message=The request could not be completed
error.unauthorized.message={0}
error.access-denied.message=Access denied
error.access-denied.reason=You are not allowed to perform this operation
error.concurrent-modification-conflict.message=The resource was modified by another request
error.concurrent-modification.reason=Reload the resource and retry the operation
error.duplicate-resource-conflict.message=A resource with the specified identifier already exists
error.duplicate-resource.reason=Verify unique attributes or identifiers and try again.
error.data-integrity.reason=The data could not be stored

# IAM error codes
error.user-not-found.message=No user matches the supplied identifier
error.user-conflict.message={0}
error.google-account-not-found.message=This Google account is not registered yet; complete the onboarding to continue

# Profiles error codes
error.profile-conflict.message={0}
error.owner-not-found.message=No owner matches the supplied identifier
error.owner-conflict.message={0}
error.technician-not-found.message=No technician matches the supplied identifier
error.technician-conflict.message={0}
error.dashboard-config-not-found.message=No dashboard configuration matches the supplied identifier
error.dashboard-config-conflict.message={0}
error.dashboard-card-not-found.message=No dashboard card matches the supplied identifier

# Assets error codes
error.equipment-conflict.message={0}
error.equipment-not-found.message=No equipment matches the supplied identifier

# Service request error codes
error.service-request-not-found.message=No service request matches the supplied identifier
error.review-not-found.message=No review matches the supplied identifier
error.invalid-status-transition.message={0}
error.technician-not-eligible.message={0}
error.review-not-allowed.message={0}
