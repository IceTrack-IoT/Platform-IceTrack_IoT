# Notifications (MessageFormat: '' is a literal quote)
# {0} request, {1} service type, {2} priority, {3} equipment, {4} site, {5} assignment instant
notification.technician-assigned=You were assigned service request {0} ({1}, priority {2}) for equipment {3} at site {4} on {5}.
# {0} request, {1} equipment
notification.technician-unassigned=Service request {0} for equipment {1} was reassigned to another technician.
# {0} technician, {1} request, {2} equipment, {3} reason
notification.service-request-rejected=Technician {0} rejected service request {1} for equipment {2}: {3}
# {0} request, {1} equipment, {2} reason
notification.service-request-canceled=Service request {0} for equipment {1} was canceled: {2}
# {0} window, {1} equipment, {2} origin, {3} start, {4} expiration, {5} request, {6} technician
notification.maintenance-window-opened=Equipment {1} entered maintenance (window {0}, started from the {2} at {3}, until {4}) for service request {5}, technician {6}.
# {0} window, {1} equipment, {2} origin, {3} start, {4} expiration
notification.maintenance-window-opened.unlinked=Unlinked maintenance window {0}: equipment {1} entered maintenance from the {2} at {3}, until {4}, with no service request in progress.
# {0} window, {1} equipment, {2} origin, {3} end, {4} closure reason, {5} request, {6} technician
notification.maintenance-window-closed=Equipment {1} left maintenance (window {0}, {2}) at {3}: {4}. Service request {5}, technician {6}.
# {0} window, {1} equipment, {2} origin, {3} end, {4} closure reason
notification.maintenance-window-closed.unlinked=Equipment {1} left maintenance (unlinked window {0}, {2}) at {3}: {4}.
