services:
  db:
    image: postgres:18-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: icetrack
    networks:
      - ice-track-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d icetrack" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: spring-app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ice-track-net

networks:
  ice-track-net:
    name: ice-track-net
    driver: bridge
